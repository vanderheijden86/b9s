<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1e26">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="b9s">
<meta name="referrer" content="no-referrer">
<title>b9s</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script defer src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="sat" aria-hidden="true"></div>
  <header class="hd" id="hd"></header>
  <div class="chips" id="chips" role="toolbar" aria-label="Filters"></div>
  <div class="stale" id="stale" role="status" hidden></div>
  <main id="main">
    <section class="view" id="vTree" aria-label="Issue tree">
      <div id="fbar"></div>
      <div class="scroll" id="treeList"><div class="ptr" id="ptr">↓ pull to reload</div><div id="treeRows" role="list"></div></div>
    </section>
    <section class="view" id="vBoard" aria-label="Board" hidden></section>
    <section class="view" id="vSearch" aria-label="Search" hidden>
      <div class="sbox"><input id="sIn" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="status:open type:bug words…" aria-label="Query"><button id="sApply" data-act="applysearch">Apply</button></div>
      <div class="sugg" id="sSugg" aria-label="Completions"></div>
      <div class="scroll" id="sList"></div>
    </section>
    <section class="view" id="vMore" aria-label="More" hidden><div class="scroll" id="moreList"></div></section>
    <section class="view" id="vGraph" aria-label="Dependency graph" hidden></section>
  </main>
  <nav class="bar" id="bar" aria-label="Views"></nav>
  <div id="detailHost"></div>
  <div id="sheetHost"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="boot" id="boot">Loading issues…</div>
</div>
</body>
</html>
