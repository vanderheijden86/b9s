version: 2

project_name: b9s

# The binary embeds pkg/web/dist, which is committed so a release needs no
# Node toolchain. These tests stop a release whose bundle or generated API
# types no longer match the web/ sources in the tagged commit.
before:
  hooks:
    - go test ./pkg/web -run 'TestEmbeddedBundleIsCurrent|TestGeneratedTypesAreCurrent' -count=1

builds:
  - main: ./cmd/b9s
    binary: b9s
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vanderheijden86/b9s/pkg/version.Version=v{{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

# Linux packages attached to the release for dpkg -i and rpm -i. There is no
# hosted apt or dnf repository, so a package install upgrades only when the
# user installs the next release's package.
nfpms:
  - package_name: b9s
    file_name_template: >-
      {{ .PackageName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    vendor: vanderheijden86
    homepage: https://github.com/vanderheijden86/b9s
    maintainer: vanderheijden86 <vanderheijden86@users.noreply.github.com>
    description: "Fast, focused TUI viewer and editor for beads projects"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/b9s/LICENSE
      - src: README.md
        dst: /usr/share/doc/b9s/README.md

checksum:
  name_template: 'checksums.txt'

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew tap publishing
brews:
  - name: b9s
    repository:
      owner: vanderheijden86
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/vanderheijden86/b9s
    description: "Fast, focused TUI viewer and editor for beads projects"
    license: "MIT"
    install: |
      bin.install "b9s"
    test: |
      system "#{bin}/b9s", "--version"
