# Every keystroke a browser sends goes to tmux. Without a prefix and without
# root-table bindings, no key or mouse menu can open a window or a split.
# default-shell stays /bin/sh: tmux runs the session's command through it.
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
set -g mouse off
set -g status off
# The entrypoint starts the server before anyone connects, so the server's
# environment is the pod's and never the first visitor's.
set -s exit-empty off
# A session outlives its browser tab, so reconnecting resumes where the
# person left off. It ends when b9s exits.
