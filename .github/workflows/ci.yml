name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.5'

    - name: Build
      run: go build -v ./cmd/b9s

    - name: Test
      run: go test -timeout=5m -covermode=atomic -coverprofile=coverage.out ./pkg/... ./cmd/b9s

    - name: E2E Tests
      run: go test -timeout=10m -v ./tests/e2e -count=1

    - name: Enforce Coverage Threshold
      run: |
        total=$(awk '
          NR == 1 { next }
          {
            file = $1
            sub(/:.*/, "", file)
            if (file !~ /^github.com\/vanderheijden86\/beadwork\/pkg\//) next
            stmts = $2; count = $3; all += stmts
            if (count > 0) hit += stmts
          }
          END {
            if (all == 0) { printf("0.00"); exit 0 }
            printf("%.2f", (hit / all) * 100)
          }
        ' coverage.out)
        echo "pkg/* coverage: ${total}% (threshold 65%)"
        awk -v c="$total" 'BEGIN { if (c < 65.0) { printf("FAIL: pkg/* coverage %.2f%% is below 65%%\n", c); exit 1 } }'

  # The web UI's Playwright suite: Chromium (Pixel 7, desktop) and WebKit
  # (iPhone 14, iPad). globalSetup builds the bundle and the binary itself.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.5'

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      run: npm --prefix web ci

    - name: Install browsers
      working-directory: web
      run: npx playwright install --with-deps chromium webkit

    - name: Web E2E
      run: make web-e2e

    - name: Upload traces
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-traces
        path: web/test-results
        retention-days: 7
