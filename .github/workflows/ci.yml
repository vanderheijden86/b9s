name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.25.5'

    - name: Build
      run: go build -v ./cmd/b9s

    - name: Test
      run: go test -timeout=5m -covermode=atomic -coverprofile=coverage.out ./pkg/... ./cmd/b9s

    - name: E2E Tests
      run: go test -timeout=10m -v ./tests/e2e -count=1

    - name: Enforce Coverage Threshold
      run: |
        total=$(awk '
          NR == 1 { next }
          {
            file = $1
            sub(/:.*/, "", file)
            if (file !~ /^github.com\/vanderheijden86\/beadwork\/pkg\//) next
            stmts = $2; count = $3; all += stmts
            if (count > 0) hit += stmts
          }
          END {
            if (all == 0) { printf("0.00"); exit 0 }
            printf("%.2f", (hit / all) * 100)
          }
        ' coverage.out)
        echo "pkg/* coverage: ${total}% (threshold 65%)"
        awk -v c="$total" 'BEGIN { if (c < 65.0) { printf("FAIL: pkg/* coverage %.2f%% is below 65%%\n", c); exit 1 } }'
