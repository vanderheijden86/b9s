<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Focus</title>
<link rel="stylesheet" href="style.css">
<style>
  .stage svg { display: block; width: 100%; height: 700px; }
  .ring { fill: none; stroke: var(--line); stroke-dasharray: 2 5; }
  .spoke { fill: none; }
  .spoke.follows { stroke: var(--ink); stroke-width: 1.8; opacity: .6; }
  .spoke.cites { stroke: var(--cites); stroke-dasharray: 5 4; stroke-width: 1.3; }
  .spoke.child-of { stroke: var(--epic); stroke-width: 1.3; opacity: .55; }
  .spoke.supersedes { stroke: var(--superseded); stroke-width: 2.2; }
  .spoke.bad { stroke: var(--superseded); opacity: 1; }
  .spoke.far { opacity: .3; }
  .elabel { font-size: 10px; fill: var(--muted); }
  .n { cursor: pointer; }
  .n text { font-size: 11.5px; }
  .n .t { fill: var(--muted); font-size: 10.5px; }
  .n.far { opacity: .45; }
  .n.far:hover { opacity: 1; }
  .n.center text.t { font-size: 13px; fill: var(--ink); font-weight: 600; }
  .crumbs { padding: 10px 14px 0; font-size: 13px; color: var(--muted); }
  .crumbs a { color: var(--accent, var(--issue)); cursor: pointer; text-decoration: none; font-family: var(--mono); }
  .search { display: flex; gap: 6px; padding: 8px 16px 0; flex-wrap: wrap; }
  .search button { font: 12px var(--mono); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .search button:hover { background: var(--soft); }
</style>
</head>
<body>
<nav class="top"></nav>
<header class="intro">
  <h1>3 · Focus</h1>
  <p>One thing in the middle, what it touches on the inner ring, and one hop further on the outer ring. Click any node to walk there. Issue and Memory are both first-class: the same view answers "what does this task rest on" and "who rests on this decision".</p>
</header>
<div class="search" id="jump"></div>
<div class="layout">
  <div class="stage"><div class="crumbs" id="crumbs"></div><svg id="g" viewBox="0 0 900 700"></svg></div>
  <aside class="panel" id="panel"></aside>
</div>
<script src="data.js"></script>
<script>
renderNav('3-focus.html');
const svg = document.getElementById('g'), panel = document.getElementById('panel'), crumbs = document.getElementById('crumbs');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const CX = 450, CY = 350, R1 = 160, R2 = 275;
const KIND_ORDER = { follows: 0, supersedes: 1, cites: 2, 'child-of': 3 };
let trail = [];

function shape(g, id, size) {
  const n = G.nodes.get(id), h = G.health(id);
  if (n.kind === 'memory') {
    el('circle', { r: size, fill: `var(--${n.status})`, opacity: n.status === 'superseded' ? .6 : 1 }, g);
    el('text', { 'text-anchor': 'middle', dy: 4, style: 'fill:#fff;font-weight:600' }, g).textContent = n.n;
  } else {
    const w = Math.max(size * 2, id.length * 7.5 + 14);
    el('rect', { x: -w / 2, y: -size * .65, width: w, height: size * 1.3, rx: 6,
      fill: n.type === 'epic' ? 'var(--epic)' : h === 'none' ? 'var(--panel)' : h === 'dead' ? 'var(--superseded)' : 'var(--issue)',
      stroke: h === 'none' ? 'var(--muted)' : 'none', 'stroke-dasharray': '3 3' }, g);
    el('text', { 'text-anchor': 'middle', dy: 4, style: `fill:${h === 'none' ? 'var(--muted)' : '#fff'};font-family:var(--mono)` }, g).textContent = id;
  }
}
const short = (s, k) => s.length > k ? s.slice(0, k - 1) + '…' : s;

function focus(id, push = true) {
  if (push) { const i = trail.indexOf(id); trail = i >= 0 ? trail.slice(0, i + 1) : [...trail, id]; }
  svg.innerHTML = '';
  el('circle', { class: 'ring', cx: CX, cy: CY, r: R1 }, svg);
  el('circle', { class: 'ring', cx: CX, cy: CY, r: R2 }, svg);
  const gl = el('g', {}, svg), gn = el('g', {}, svg);

  const ring1 = G.neighbours(id).sort((a, b) => KIND_ORDER[a.edge.kind] - KIND_ORDER[b.edge.kind] || (a.dir > b.dir ? 1 : -1));
  const seen = new Set([id, ...ring1.map(x => x.other)]);
  const placed = new Map([[id, { x: CX, y: CY }]]);
  ring1.forEach((x, i) => {
    // Two neighbours on a horizontal line would sit on the centre title.
    const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / Math.max(ring1.length, 1) + (ring1.length === 2 ? Math.PI / 4 : 0);
    placed.set(x.other, { x: CX + Math.cos(a) * R1, y: CY + Math.sin(a) * R1, a });
  });
  // Outer ring: each inner node's own neighbours, fanned out behind it.
  const ring2 = [];
  ring1.forEach(x => {
    const more = G.neighbours(x.other).filter(y => !seen.has(y.other));
    more.forEach(y => seen.add(y.other));
    more.forEach((y, j) => ring2.push({ ...y, via: x.other, j, of: more.length }));
  });
  ring2.forEach(y => {
    const base = placed.get(y.via).a, spread = Math.min(.5, 1.6 / ring1.length);
    const a = base + (y.of === 1 ? 0 : (y.j / (y.of - 1) - .5) * spread * 2);
    placed.set(y.other, { x: CX + Math.cos(a) * R2, y: CY + Math.sin(a) * R2 });
  });

  const spoke = (from, to, e, far, dir) => {
    const p = placed.get(from), q = placed.get(to);
    const bad = e.kind === 'follows' && G.nodes.get(e.to).status === 'superseded';
    el('line', { class: `spoke ${e.kind}${bad ? ' bad' : ''}${far ? ' far' : ''}`, x1: p.x, y1: p.y, x2: q.x, y2: q.y }, gl);
    if (!far) {
      const t = el('text', { class: 'elabel', x: (p.x * .45 + q.x * .55), y: (p.y * .45 + q.y * .55) - 4, 'text-anchor': 'middle' }, gl);
      t.textContent = EDGE_TEXT[dir][e.kind].toLowerCase();
    }
  };
  ring1.forEach(x => spoke(id, x.other, x.edge, false, x.dir));
  ring2.forEach(y => spoke(y.via, y.other, y.edge, true, y.dir));

  const node = (nid, cls, size, titleLen) => {
    const p = placed.get(nid), n = G.nodes.get(nid);
    const g = el('g', { class: `n ${cls}`, 'data-id': nid, transform: `translate(${p.x},${p.y})` }, gn);
    shape(g, nid, size);
    const below = p.y >= CY - 2;
    el('text', { class: 't', 'text-anchor': 'middle', y: below ? size + 14 : -size - 7 }, g).textContent = short(n.title, titleLen);
    const tip = el('title', {}, g); tip.textContent = `${G.label(nid)} · ${n.title}`;
  };
  ring2.forEach(y => node(y.other, 'far', 11, 22));
  ring1.forEach(x => node(x.other, 'near', 15, 30));
  node(id, 'center', 26, 48);

  crumbs.innerHTML = trail.map(t => `<a data-id="${t}">${G.label(t)}</a>`).join(' → ');
  panel.innerHTML = detailHTML(id);
}

svg.addEventListener('click', e => { const g = e.target.closest('.n'); if (g) focus(g.dataset.id); });
crumbs.addEventListener('click', e => { const a = e.target.closest('[data-id]'); if (a) focus(a.dataset.id); });
panel.addEventListener('click', e => { const li = e.target.closest('[data-id]'); if (li) focus(li.dataset.id); });
document.getElementById('jump').innerHTML = '<span class="muted" style="font-size:12px;align-self:center">Start from:</span>' +
  ['xx9w.2', 'adr-0026', 'vd9g.1.6', 'adr-0009', 'hffz', 'n0wb'].map(i => `<button data-id="${i}">${G.label(i)}</button>`).join('');
document.getElementById('jump').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) { trail = []; focus(b.dataset.id); } });
focus('xx9w.2');
</script>
</body>
</html>
