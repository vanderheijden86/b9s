  text: "#F8F8F2"
  subtext: "#BFBFBF"
  muted: "#6272A4"
  primary: "#BD93F9"
  secondary: "#6272A4"
  info: "#8BE9FD"
  success: "#50FA7B"
  warning: "#FFB86C"
  danger: "#FF5555"
  border: "#44475A"
  open: "#50FA7B"
  inProgress: "#8BE9FD"
